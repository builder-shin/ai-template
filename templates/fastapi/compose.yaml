# 개발 인프라. `uv run poe setup`이 기본 프로필을 띄운다(docker compose up -d --wait).
# 포트는 모두 127.0.0.1에만 연다. 호스트 포트는 기본 포트에 20000을 더한 번호이고, 컨테이너 안은 기본 포트다.
# 다른 로컬 스택이 흔히 여는 기본 포트와 10000을 더한 포트(예: 5432, 15432)를 피한다.
# 계정과 키는 .env.example의 개발용 값과 같다.
# - 기본 프로필: PostgreSQL, Valkey, SeaweedFS(S3), Mailpit, 모의 OAuth 서버
# - observability 프로필: Grafana LGTM(OpenTelemetry 수집과 조회). `docker compose --profile observability up -d`
# - app 프로필: 이 템플릿의 이미지(Dockerfile)로 migrate, api, worker, scheduler를 띄운다.
#   `docker compose --profile app up -d --build --wait`. 적합성 스위트와 배포 확인에 쓴다.

# app 프로필 서비스의 공통 설정. 주소의 호스트는 compose 서비스 이름이고 포트는 컨테이너 안의 포트다.
x-app: &app
  build: .
  image: fastapi-template-app
  profiles: [app]
  environment:
    APP_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
    REDIS_URL: redis://valkey:6379/0
    S3_ENDPOINT_URL: http://seaweedfs:8333
    # presigned URL은 호스트의 브라우저가 쓴다
    S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:28333
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: app
    S3_SECRET_ACCESS_KEY: app-secret
    S3_BUCKET: app
    JWT_SECRET: compose-app-profile-jwt-signing-key
    SMTP_URL: smtp://mailpit:1025
    MAIL_FROM: "AI Template <no-reply@example.com>"
    FRONTEND_URL: http://localhost:3000
    # 적합성 스위트가 이 계정으로 관리자 흐름을 돈다(저장소의 scripts/src/conformance/targets.ts와 같은 값).
    SEED_ADMIN_EMAIL: admin@example.com
    SEED_ADMIN_PASSWORD: admin-password # betterleaks:allow
    # 적합성 스위트는 한 IP에서 가입과 로그인을 많이 하므로 한도를 크게 둔다.
    RATE_LIMIT_GLOBAL: "1000000"
    RATE_LIMIT_LOGIN_IP: "1000000"
    RATE_LIMIT_LOGIN_IDENTIFIER: "1000000"
    RATE_LIMIT_REGISTRATION_IP: "1000000"
    RATE_LIMIT_MAIL_IP: "1000000"
    RATE_LIMIT_MAIL_EMAIL: "1000000"

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 폴더를 만든다.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "app", "--dbname", "app"]
      interval: 2s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # weed mini: master, volume, filer, S3를 한 프로세스로 띄운다. 시작할 때 버킷(S3_BUCKET과 같은
    # 이름)이 없으면 만든다. 브라우저 업로드용 CORS는 setup이 S3 API로 건다.
    command: ["mini", "-dir=/data", "-bucket=app"]
    environment:
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: app-secret
    ports:
      - "127.0.0.1:28333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:21025:1025" # SMTP
      - "127.0.0.1:28025:8025" # 웹 화면과 API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.3
    ports:
      - "127.0.0.1:28080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/default/.well-known/openid-configuration"]
      interval: 2s
      timeout: 5s
      retries: 60

  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: [observability]
    ports:
      - "127.0.0.1:23000:3000" # Grafana
      - "127.0.0.1:24317:4317" # OTLP gRPC
      - "127.0.0.1:24318:4318" # OTLP HTTP
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    <<: *app
    # 마이그레이션과 시드를 하고 끝난다. api, worker, scheduler는 이것이 성공해야 뜬다.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    <<: *app
    command: ["taskiq", "worker", "app.worker:create_broker", "--no-configure-logging"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  scheduler:
    <<: *app
    # 반드시 하나만 띄운다(여러 개면 같은 주기 작업을 여러 번 보낸다).
    command: ["taskiq", "scheduler", "app.scheduler:create_scheduler", "--no-configure-logging"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
