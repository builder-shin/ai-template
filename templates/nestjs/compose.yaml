# 개발 인프라. 포트는 127.0.0.1에만 열며 이름은 compose가 프로젝트 폴더에서 정한다.
x-app: &app
  image: nestjs-app:local
  build: .
  profiles: [app]
  # app 프로필은 적합성·CI용 공개 fixture이며 개발 setup의 .env 설정과 독립이다.
  environment: &app-environment
    APP_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: postgresql://app:app@postgres:5432/app # betterleaks:allow 사유: 개발 compose 예시 계정
    REDIS_URL: redis://valkey:6379/0
    S3_ENDPOINT_URL: http://seaweedfs:8333
    S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:28333
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: app
    S3_SECRET_ACCESS_KEY: app-secret # betterleaks:allow 사유: compose 스토리지의 공개 fixture
    S3_BUCKET: app
    STORAGE_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    FILE_MAX_SIZE: "10485760"
    FILE_ALLOWED_TYPES: image/png,image/jpeg,image/webp,image/gif
    FILE_USER_QUOTA: "1073741824"
    JWT_SECRET: compose-app-profile-jwt-signing-key # betterleaks:allow 사유: app 프로필의 공개 fixture
    IDENTIFIER_HASH_SECRET: compose-app-profile-identifier-hash-key # betterleaks:allow 사유: app 프로필의 공개 fixture
    RECENT_LOGIN_SECONDS: "600"
    SMTP_URL: smtp://mailpit:1025
    MAIL_FROM: AI Template <no-reply@example.com>
    FRONTEND_URL: http://localhost:3000
    REALTIME_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    API_URL: http://localhost:8000
    OAUTH_REDIRECT_URIS: http://localhost:3000/oauth/callback,aitpl-example://oauth/callback
    OAUTH_GOOGLE_CLIENT_ID: local-google-client
    OAUTH_GOOGLE_CLIENT_SECRET: local-google-secret # betterleaks:allow 사유: compose 모의 OAuth 공개 fixture
    OAUTH_GOOGLE_AUTHORIZE_URL: http://127.0.0.1:28080/google/authorize
    OAUTH_GOOGLE_TOKEN_URL: http://oauth:8080/google/token
    OAUTH_GOOGLE_PROFILE_URL: http://oauth:8080/google/userinfo
    OAUTH_KAKAO_CLIENT_ID: local-kakao-client
    OAUTH_KAKAO_CLIENT_SECRET: local-kakao-secret # betterleaks:allow 사유: compose 모의 OAuth 공개 fixture
    OAUTH_KAKAO_AUTHORIZE_URL: http://127.0.0.1:28080/kakao/authorize
    OAUTH_KAKAO_TOKEN_URL: http://oauth:8080/kakao/token
    OAUTH_KAKAO_PROFILE_URL: http://oauth:8080/kakao/userinfo
    OAUTH_NAVER_CLIENT_ID: local-naver-client
    OAUTH_NAVER_CLIENT_SECRET: local-naver-secret # betterleaks:allow 사유: compose 모의 OAuth 공개 fixture
    OAUTH_NAVER_AUTHORIZE_URL: http://127.0.0.1:28080/naver/authorize
    OAUTH_NAVER_TOKEN_URL: http://oauth:8080/naver/token
    OAUTH_NAVER_PROFILE_URL: http://oauth:8080/naver/userinfo
    SEED_ADMIN_EMAIL: compose-admin@example.com
    SEED_ADMIN_PASSWORD: compose-app-profile-admin-password # betterleaks:allow 사유: app 프로필의 공개 시드 관리자
    OTEL_ENABLED: "false"
    OTEL_SERVICE_NAME: app
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    RATE_LIMIT_GLOBAL: "1000000"
    RATE_LIMIT_LOGIN_IP: "1000000"
    RATE_LIMIT_LOGIN_IDENTIFIER: "1000000"
    RATE_LIMIT_REGISTRATION_IP: "1000000"
    RATE_LIMIT_MAIL_IP: "1000000"
    RATE_LIMIT_MAIL_EMAIL: "1000000"
    RATE_LIMIT_PASSWORD_CHANGE_USER: "1000000"
    PORT: "8000"
    FORWARDED_ALLOW_IPS: ""
services:
  migrate:
    <<: *app
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    <<: *app
    command: [node, dist/seed.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
  storage-init:
    <<: *app
    command: [node, dist/storage-init.js]
    depends_on:
      seaweedfs: { condition: service_healthy }
  api:
    <<: *app
    environment:
      <<: *app-environment
      PORT: "8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on: &runtime-dependencies
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      oauth: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8000/health/live',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: [node, --import, ./dist/core/telemetry/register.js, dist/worker.js]
    depends_on: *runtime-dependencies
  scheduler:
    <<: *app
    command: [node, --import, ./dist/core/telemetry/register.js, dist/scheduler.js]
    depends_on: *runtime-dependencies
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "app", "--dbname", "app"]
      interval: 2s
      timeout: 5s
      retries: 30
  valkey:
    image: valkey/valkey:9.1.2
    ports: ["127.0.0.1:26379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-bucket=app"]
    environment:
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: app-secret
    ports: ["127.0.0.1:28333:8333"]
    volumes: ["seaweedfs-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60
  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_ENABLE_CHAOS: "true"
    ports: ["127.0.0.1:21025:1025", "127.0.0.1:28025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.3
    ports: ["127.0.0.1:28080:8080"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:8080/default/.well-known/openid-configuration",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: [observability]
    ports: ["127.0.0.1:23000:3000", "127.0.0.1:24317:4317", "127.0.0.1:24318:4318"]
    healthcheck:
      test: [CMD, /otel-lgtm/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  seaweedfs-data:
