# 독립 프로젝트의 setup이 설치하며 저장소 사본은 상위 hook을 유지한다.
pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,mjs,js,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,mjs,js}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: secrets
      run: pnpm exec tsx scripts/tools/cli.ts betterleaks git --pre-commit --staged --no-banner --redact
pre-push:
  jobs:
    - name: check
      run: pnpm check
