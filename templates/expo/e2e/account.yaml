appId: __BUNDLE_ID__
---
- runScript: { file: bridge.js, env: { ACTION: data } }
- openLink: ${output.data.scheme + '://me'}
- runFlow: support/open-link.yaml
- tapOn: { id: "field-Name" }
- longPressOn: { id: "field-Name" }
- tapOn: "Select all|Select All"
- eraseText: 100
- inputText: Native Updated
- runFlow: support/dismiss-keyboard.yaml
- tapOn: { id: "button-Save" }
- assertVisible: Saved.
- runScript: { file: bridge.js, env: { ACTION: inspect-account } }
- assertTrue: ${output.result.name === 'Native Updated' && output.result.locale === 'en'}
- stopApp
- openLink: ${output.data.profileLink}
- runFlow: support/open-link.yaml
- assertVisible: Native Updated
- tapOn: { id: "button-Sessions" }
- assertVisible: Current session
- scrollUntilVisible: { element: { id: "button-Sign out other sessions" } }
- tapOn: { id: "button-Sign out other sessions" }
- scrollUntilVisible: { element: { id: "button-Cancel" } }
- tapOn: { id: "button-Cancel" }
- scrollUntilVisible: { element: { text: "Current session" }, direction: UP }
- assertVisible: Current session
