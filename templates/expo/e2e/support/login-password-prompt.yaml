appId: __BUNDLE_ID__
---
- runFlow:
    when: { platform: iOS }
    commands:
      - extendedWaitUntil: { visible: "Not Now|Current session", timeout: 30000 }
      - runFlow:
          when: { visible: "Not Now" }
          commands:
            - assertVisible: "Save"
            - tapOn: "Not Now"
