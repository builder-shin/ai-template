name: ci
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_MODE: backend
      EXPO_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
      EXPO_PUBLIC_REALTIME_URL: https://api.example.com
      EXPO_PUBLIC_FRONTEND_URL: https://app.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec expo install --check
      - run: pnpm exec expo-doctor
      - run: pnpm export --platform android
      - run: pnpm export --platform ios
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_MODE: backend
      EXPO_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
      EXPO_PUBLIC_REALTIME_URL: https://api.example.com
      EXPO_PUBLIC_FRONTEND_URL: https://app.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |-
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned native Android platform tools
        run: '"${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.1.12297006"'
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: NATIVE_ANDROID_ARCHITECTURES=x86_64 pnpm test:e2e --platform android --device emulator-5554 --run-id ci-android
      - run: pnpm build --platform android --configuration release --run-id ci-android
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_MODE: backend
      EXPO_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
      EXPO_PUBLIC_REALTIME_URL: https://api.example.com
      EXPO_PUBLIC_FRONTEND_URL: https://app.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci:ios
