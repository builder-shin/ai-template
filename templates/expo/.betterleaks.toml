[extend]
useDefault = true

# Only generated contract copies are excluded; handwritten code remains scanned.
[[allowlists]]
paths = ['''^contract/''', '''(^|/)generated/''']

[[allowlists]]
description = "Public UI label, not a credential"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''^src/lib/i18n/messages/en\.json$''']
regexTarget = "line"
regexes = ['''^\s*"password": "Password",?\s*$'''] # betterleaks:allow

[[allowlists]]
description = "Exact public password navigation labels in both catalogs"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''^src/lib/i18n/messages/(?:ko|en)\.json$''']
regexTarget = "line"
regexes = ['''^\s*"forgotPassword": "(?:Forgot password|비밀번호 찾기)",?\s*$''', '''^\s*"resetPassword": "(?:Reset password|비밀번호 재설정)",?\s*$'''] # betterleaks:allow public labels
