[extend]
useDefault = true

# 생성한 잠금 파일의 패키지 이름만 허용한다.
[[allowlists]]
description = "@inquirer/password 의존성 이름"
targetRules = ["generic-password"]
paths = ['''^pnpm-lock\.yaml$''']
regexTarget = "line"
regexes = ['''@inquirer/password''']

# 동기화한 계약 사본과 생성물만 제외한다. 수기 코드는 계속 검사한다.
[[allowlists]]
paths = [
  '''^contract/''',
  '''(^|/)generated/''',
  '''^src/lib/api/schema\.d\.ts$''',
]
