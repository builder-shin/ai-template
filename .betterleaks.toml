# 기본 규칙을 그대로 쓰되, 비밀 값이 들어갈 수 없는 파일은 검사하지 않는다.
# - pnpm-lock.yaml: 패키지 이름과 해시뿐이다(@inquirer/password 같은 이름이 오탐된다).
# - 계약: TypeSpec 원본과 생성된 OpenAPI에는 필드 이름(password 등)과 스키마 참조만 있다.
#   템플릿이 내보낸 openapi.json도 같다(판별자 매핑 "password": "#/components/..." 등).
# - 룰셋 번들: 제3자 라이브러리를 묶어 압축한 생성물이다. 템플릿 사본도 같다.
# 테스트의 가짜 값은 줄 끝에 `betterleaks:allow` 주석을 달아 하나씩 허용한다.
prefilter = '''
filter.matchesAny(attributes["path"], [
  `^pnpm-lock\.yaml$`,
  `^contract/openapi\.yaml$`,
  `^contract/typespec/src/.+\.tsp$`,
  `^templates/nextjs/contract/openapi\.yaml$`,
  `^templates/nextjs/contract/typespec/src/.+\.tsp$`,
  `^templates/nextjs-admin/contract/openapi\.yaml$`,
  `^templates/nextjs-admin/contract/typespec/src/.+\.tsp$`,
  `^templates/expo/contract/openapi\.yaml$`,
  `^templates/expo/contract/typespec/src/.+\.tsp$`,
  `^templates/[^/]+/openapi\.json$`,
  `^prototypes/nestjs/openapi\.json$`,
  `^contract/api-style/dist/lint\.mjs$`,
  `^templates/[^/]+/api-style/lint\.mjs$`,
])
'''

[extend]
useDefault = true

[[allowlists]]
description = "생성한 프런트엔드 잠금 파일의 @inquirer/password 패키지 이름"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''^templates/(?:nextjs(?:-admin)?|nestjs|expo)/pnpm-lock\.yaml$''', '''^prototypes/nestjs/pnpm-lock\.yaml$''', '''^create/test/fixtures/(?:nestjs|nextjs(?:-admin)?)/pnpm-lock\.yaml$''']
regexTarget = "line"
regexes = ['''@inquirer/password''']

[[allowlists]]
description = "Expo UI의 공개 비밀번호 레이블 한 줄"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''^templates/expo/src/lib/i18n/messages/en\.json$''']
regexTarget = "line"
regexes = ['''^\s*"password": "Password",?\s*$''']

[[allowlists]]
description = "Expo 인증 화면의 공개 비밀번호 탐색 레이블 네 줄"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''^templates/expo/src/lib/i18n/messages/(?:ko|en)\.json$''']
regexTarget = "line"
regexes = ['''^\s*"forgotPassword": "(?:Forgot password|비밀번호 찾기)",?\s*$''', '''^\s*"resetPassword": "(?:Reset password|비밀번호 재설정)",?\s*$''']

# 계획 문서(docs/superpowers/plans)는 템플릿과 적합성 스위트의 코드를 그대로 옮겨 적는다. 마크다운 안의
# 타입 선언과 테스트 상수(`password: Password`, `password: PASSWORD`)를 generic-password 규칙이 비밀번호로
# 오탐하므로, 계획 문서에서만 이 규칙을 끈다. 다른 규칙(키, 토큰)은 계획 문서도 그대로 본다.
# 옮겨 적은 원본 파일은 커밋할 때 이 규칙으로 스캔된다.
[[allowlists]]
description = "계획 문서에 옮겨 적은 코드의 비밀번호 필드와 테스트 상수"
targetRules = ["generic-password"]
paths = ['''^docs/superpowers/plans/.+\.md$''']

# 바이트 그대로 복사한 TypeScript 흐름의 상수 참조는 비밀 값이 아니다.
# 이 다섯 fixture의 generic-password와 세 식별자가 모두 맞을 때만 허용한다.
[[allowlists]]
description = "복사한 적합성 흐름의 비밀번호 상수 참조"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''^prototypes/nestjs/test/fixtures/conformance-flows/(?:me|sessions|registration|passwords|jsonapi)\.test\.ts\.txt$''']
regexes = ['''^(?:PASSWORD|NEW_PASSWORD|LONE_SURROGATE)$''']
