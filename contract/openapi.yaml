components:
  schemas:
    CollectionMeta:
      type: object
      required:
        - page
      properties:
        page:
          $ref: '#/components/schemas/PageMeta'
    ErrorCode:
      type: string
      enum:
        - jsonapi.unsupported_media_type
        - jsonapi.not_acceptable
        - jsonapi.invalid_document
        - jsonapi.invalid_query
        - jsonapi.unsupported_include
        - jsonapi.unsupported_sort
        - validation.required
        - validation.too_short
        - validation.too_long
        - validation.invalid_format
        - validation.out_of_range
        - validation.invalid_choice
        - validation.already_taken
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.token_expired
        - auth.token_invalid
        - auth.refresh_token_reused
        - auth.oauth_code_invalid
        - auth.email_not_verified
        - auth.account_deactivated
        - auth.verification_token_invalid
        - permission.denied
        - role.system_role_protected
        - resource.not_found
        - resource.conflict
        - post.invalid_transition
        - file.too_large
        - file.type_not_allowed
        - file.upload_incomplete
        - rate_limit.exceeded
        - internal.unexpected
        - service.unavailable
      description: 기계가 읽는 에러 코드. 형식은 `<영역>.<snake_case 사유>`. 새 코드는 docs/conventions/error-codes.md에도 추가한다.
    ErrorDocument:
      type: object
      required:
        - errors
        - meta
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
        meta:
          type: object
          properties:
            traceId:
              type: string
          required:
            - traceId
    ErrorObject:
      type: object
      required:
        - status
        - code
        - title
      properties:
        status:
          type: string
          description: HTTP 상태 코드(문자열).
        code:
          $ref: '#/components/schemas/ErrorCode'
        title:
          type: string
          description: 개발자용 영어 요약. 사용자에게 보여 주지 않는다.
        detail:
          type: string
          description: 개발자용 영어 설명.
        source:
          $ref: '#/components/schemas/ErrorSource'
        meta:
          type: object
          properties:
            params:
              type: object
              unevaluatedProperties: {}
              description: 번역 메시지에 끼워 넣을 변수.
    ErrorSource:
      type: object
      properties:
        pointer:
          type: string
          description: '요청 본문 안의 JSON Pointer. 예: /data/attributes/title'
        parameter:
          type: string
          description: 문제가 된 쿼리 파라미터 이름.
      description: 에러가 가리키는 위치.
    FileAttributes:
      type: object
      required:
        - filename
        - contentType
        - size
        - status
        - createdAt
      properties:
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/FileStatus'
        createdAt:
          type: string
          format: date-time
    FileCreateAttributes:
      type: object
      required:
        - filename
        - contentType
        - size
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
    FileCreateDocument:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - files
            attributes:
              $ref: '#/components/schemas/FileCreateAttributes'
          required:
            - type
            - attributes
      description: 생성 요청 문서.
    FileDocument:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/FileResource'
      description: 단건 문서. 포함 리소스가 있으면 리소스 파일에서 included를 덧붙인다.
    FileMeta:
      type: object
      properties:
        upload:
          $ref: '#/components/schemas/FileUpload'
          description: POST /files 응답에만 있다.
        downloadUrl:
          type: string
          format: uri
          description: ready인 파일에만 있다. 수명이 짧다.
        downloadUrlExpiresAt:
          type: string
          format: date-time
    FileRelationships:
      type: object
      required:
        - owner
      properties:
        owner:
          type: object
          required:
            - data
          properties:
            data:
              anyOf:
                - type: object
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      enum:
                        - users
                    id:
                      type: string
                  description: 관계가 가리키는 리소스 식별자.
                - type: 'null'
          description: 단수 관계. 대상이 없으면 data가 null이다.
    FileResource:
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          enum:
            - files
        id:
          type: string
        attributes:
          $ref: '#/components/schemas/FileAttributes'
        relationships:
          $ref: '#/components/schemas/FileRelationships'
        meta:
          $ref: '#/components/schemas/FileMeta'
      description: 관계가 있는 리소스 객체.
    FileStatus:
      type: string
      enum:
        - pending
        - ready
      description: 'pending: 업로드 URL만 발급됨. ready: 백엔드가 객체를 확인함.'
    FileUpdateAttributes:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
          description: 업로드를 마쳤다고 알린다. 백엔드가 객체를 확인한 뒤 ready로 바꾼다.
    FileUpdateDocument:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - files
            id:
              type: string
            attributes:
              $ref: '#/components/schemas/FileUpdateAttributes'
          required:
            - type
            - id
      description: 수정 요청 문서. 속성 모델의 필드는 모두 선택이어야 한다.
    FileUpload:
      type: object
      required:
        - url
        - method
        - headers
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
            - PUT
        headers:
          type: object
          unevaluatedProperties:
            type: string
          description: 업로드 요청에 그대로 붙여야 하는 헤더.
        expiresAt:
          type: string
          format: date-time
      description: 브라우저가 스토리지에 직접 올릴 때 쓰는 presigned 요청 정보.
    HealthReport:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checks:
          type: object
          unevaluatedProperties:
            type: string
            enum:
              - ok
              - unavailable
          description: '의존 대상별 상태. 예: { "database": "ok", "redis": "ok" }'
      description: 헬스체크 결과. JSON:API가 아닌 예외 엔드포인트라 application/json으로 응답한다.
    Locale:
      type: string
      enum:
        - ko
        - en
    PageMeta:
      type: object
      required:
        - number
        - size
        - total
        - totalPages
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
      description: 페이지 정보. totalPages는 ceil(total / size)이다.
    PaginationLinks:
      type: object
