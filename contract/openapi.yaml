          type: object
          required:
            - data
          properties:
            data:
              anyOf:
                - type: object
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      enum:
                        - users
                    id:
                      type: string
                  description: 관계가 가리키는 리소스 식별자.
                - type: 'null'
          description: 단수 관계. 대상이 없으면 data가 null이다.
