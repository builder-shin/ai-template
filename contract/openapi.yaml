components:
  schemas:
    AuditLogAction:
      type: string
      enum:
        - session.login_succeeded
        - session.login_failed
        - session.all_revoked
        - user.password_changed
        - user.password_reset
        - user.roles_changed
        - user.deactivated
        - user.reactivated
        - user.deleted
        - role.created
        - role.updated
        - role.deleted
        - post.deleted_by_admin
      description: 감사 로그에 남기는 행위. 두 백엔드는 이 목록 밖의 값을 쓰지 않는다.
    AuditLogAttributes:
      type: object
      required:
        - action
        - targetType
        - targetId
        - metadata
        - ipAddress
        - createdAt
      properties:
        action:
          $ref: '#/components/schemas/AuditLogAction'
        targetType:
          anyOf:
            - $ref: '#/components/schemas/AuditLogTargetType'
            - type: 'null'
          description: '대상이 없는 행위(예: 없는 계정으로 로그인 실패)면 null이다.'
        targetId:
          anyOf:
            - type: string
            - type: 'null'
        metadata:
          type: object
          unevaluatedProperties: {}
        ipAddress:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
      description: 보안·관리 행위 기록. 백엔드만 쓰고 API로는 읽기만 한다.
