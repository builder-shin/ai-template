      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResource'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/CollectionMeta'
        included:
          type: array
          items:
            $ref: '#/components/schemas/UserPublicResource'
      description: 컬렉션 문서. 페이지 링크와 페이지 메타를 항상 담는다.
