name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ai-template-tools # scripts/src/tools/cache.ts와 맞춘다.
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/src/tools/manifest.ts') }}
      - run: pnpm check
      - name: Compare the FastAPI spec with the contract (implemented operations)
        run: pnpm run -s spec-compare contract/openapi.yaml templates/fastapi/openapi.json
      - name: NestJS 전체 operation 계약 비교
        run: pnpm spec-compare contract/openapi.yaml templates/nestjs/openapi.json
      - name: NestJS 전체 컴포넌트 구조 비교
        run: pnpm spec-compare --schemas contract/openapi.yaml templates/nestjs/openapi.json
      - name: Scan git history for secrets
        run: pnpm run -s tool betterleaks git . --no-banner --redact

  fastapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: templates/fastapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run poe setup
      - run: uv run poe check
      - run: uv run poe test:e2e
      - run: docker build .

  nestjs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      npm_config_verify_deps_before_run: error
      PNPM_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/nestjs/pnpm-lock.yaml
      - run: pnpm --dir templates/nestjs install --frozen-lockfile
      - run: pnpm --dir templates/nestjs setup
      - run: pnpm --dir templates/nestjs check
      - name: 적용한 마이그레이션과 스키마의 drift 확인
        working-directory: templates/nestjs
        run: node --env-file=.env node_modules/prisma/build/index.js migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm --dir templates/nestjs test:e2e
      - name: 빌드한 API의 네 계층 계측과 health 제외 확인
        working-directory: templates/nestjs
        run: OTEL_ENABLED=true pnpm exec tsx --env-file=.env scripts/otel-probe.ts
      - run: docker build -t ai-template-nestjs:ci templates/nestjs
      - name: 이미지 UID 10001과 API live health 확인
        run: |
          test "$(docker run --rm --entrypoint id ai-template-nestjs:ci -u)" = 10001
          container="aitpl-nestjs-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'services:\n  api:\n    image: ai-template-nestjs:ci\n' > "$RUNNER_TEMP/nestjs-image.yaml"
          docker compose -p nestjs -f templates/nestjs/compose.yaml \
            -f "$RUNNER_TEMP/nestjs-image.yaml" --profile app run --detach --no-deps \
            --name "$container" --publish 127.0.0.1:18001:8000 api
          test "$(curl --fail --silent --retry 60 --retry-connrefused --retry-delay 1 \
            --retry-max-time 60 --max-time 2 --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18001/health/live)" = 200
      - name: 하네스 사본에 CI 스택 소유권 인계
        run: |
          docker rm -f "aitpl-nestjs-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          docker compose -p nestjs -f templates/nestjs/compose.yaml --profile app down -v
      - name: 독립 git 사본의 실제 hook과 widgets 전체 빠른 검사
        shell: bash
        run: |
          copy="$RUNNER_TEMP/aitpl-nestjs-harness/nestjs"
          test ! -e "$copy"
          mkdir -p "$copy"
          git archive HEAD:templates/nestjs | tar -x -C "$copy"
          cd "$copy"
          git init -b main
          git config user.name CI
          git config user.email ci@example.com
          pnpm install --frozen-lockfile
          pnpm setup
          git add .
          git commit -m "chore: initialize harness fixture"
          node -e 'require("node:fs").writeFileSync("src/hook-secret-fixture.ts", "export const token = " + JSON.stringify("ghp_" + require("node:crypto").randomBytes(18).toString("hex")) + ";\n")'
          git add src/hook-secret-fixture.ts
          scanner_status=0
          pnpm tool betterleaks git --pre-commit --staged --no-banner --redact \
            --report-format json --report-path "$RUNNER_TEMP/nestjs-hook-secrets.json" \
            > "$RUNNER_TEMP/nestjs-hook-scan.log" 2>&1 || scanner_status=$?
          hook_status=0
          git commit -m "test: reject fake secret" \
            > "$RUNNER_TEMP/nestjs-hook-commit.log" 2>&1 || hook_status=$?
          cat "$RUNNER_TEMP/nestjs-hook-scan.log" "$RUNNER_TEMP/nestjs-hook-commit.log"
          node -e '
            const fs = require("node:fs");
            const [report, hook, scannerStatus, hookStatus] = process.argv.slice(1);
            const findings = JSON.parse(fs.readFileSync(report, "utf8"));
            const output = fs.readFileSync(hook, "utf8").replace(/\x1b\[[0-9;]*m/g, "");
            const secrets = output.match(/(?:^|\n)┃\s+secrets\s+❯[^\n]*\n([\s\S]*?)(?=\n┃|$)/)?.[1] ?? "";
            if (scannerStatus !== "1" || hookStatus !== "1" ||
                !Array.isArray(findings) || !findings.some((entry) =>
                  entry.RuleID === "github-pat" && entry.File === "src/hook-secret-fixture.ts") ||
                !/\bleaks found: [1-9]\d*\b/.test(secrets))
              throw new Error("가짜 비밀의 github-pat 탐지와 secrets hook 실패를 확인하지 못했다");
          ' "$RUNNER_TEMP/nestjs-hook-secrets.json" "$RUNNER_TEMP/nestjs-hook-commit.log" \
            "$scanner_status" "$hook_status"
          git rm --cached src/hook-secret-fixture.ts
          rm src/hook-secret-fixture.ts
          printf 'export const hookProbe={value:1}\n' > src/hook-format-fixture.ts
          git add src/hook-format-fixture.ts
          if pnpm exec prettier --check src/hook-format-fixture.ts >/dev/null 2>&1; then
            echo "포맷 음성 fixture가 이미 올바르다" >&2
            exit 1
          fi
          git commit -m "test: format and restage fixture"
          pnpm exec prettier --check src/hook-format-fixture.ts
          git diff --exit-code
          pnpm gen:module widgets
          pnpm gen
          pnpm check --fast
      - name: NestJS CI 소유 스택과 이미지 정리
        if: ${{ always() }}
        run: |
          docker rm -f "aitpl-nestjs-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          docker compose -p nestjs -f templates/nestjs/compose.yaml --profile app down -v
          docker image rm ai-template-nestjs:ci nestjs-app:local || true
          rm -rf "$RUNNER_TEMP/aitpl-nestjs-harness"
          rm -f "$RUNNER_TEMP/nestjs-image.yaml" "$RUNNER_TEMP/nestjs-hook-secrets.json" \
            "$RUNNER_TEMP/nestjs-hook-scan.log" "$RUNNER_TEMP/nestjs-hook-commit.log"

  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: templates/nextjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:e2e
        env:
          E2E_TARGET: mock
      - name: Build the web image
        run: docker build --tag ai-template-nextjs:ci .

  nextjs-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: templates/nextjs-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/nextjs-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:e2e
        env:
          E2E_TARGET: mock
      - name: Build the admin image
        run: docker build --tag ai-template-nextjs-admin:ci .

  nextjs-e2e-fastapi:
    runs-on: ubuntu-latest
    # 2 CPU·8 GB에서 FastAPI 이미지·web 빌드와 E2E, 실패 뒤 정리 시간을 둔다.
    timeout-minutes: 60
    env:
      WEB_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            templates/nextjs/pnpm-lock.yaml
      - id: install-root
        run: pnpm install --frozen-lockfile
      - run: pnpm --dir templates/nextjs install --frozen-lockfile
      - run: pnpm --dir templates/nextjs exec playwright install --with-deps chromium
      - name: Run the shared web E2E against FastAPI
        timeout-minutes: 45
        run: pnpm web-e2e fastapi --run-id "$WEB_E2E_RUN_ID"
      - name: Clean up the dedicated FastAPI stack
        if: ${{ always() && steps.install-root.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm web-e2e fastapi --run-id "$WEB_E2E_RUN_ID" --down

  nextjs-admin-e2e-fastapi:
    runs-on: ubuntu-latest
    # 2 CPU·8 GB에서 FastAPI 이미지·admin 빌드와 E2E, 실패 뒤 정리 시간을 둔다.
    timeout-minutes: 60
    env:
      ADMIN_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            templates/nextjs-admin/pnpm-lock.yaml
      - id: install-root
        run: pnpm install --frozen-lockfile
      - run: pnpm --dir templates/nextjs-admin install --frozen-lockfile
      - run: pnpm --dir templates/nextjs-admin exec playwright install --with-deps chromium
      - name: Run the admin E2E against FastAPI
        timeout-minutes: 45
        run: pnpm admin-e2e fastapi --run-id "$ADMIN_E2E_RUN_ID"
      - name: Clean up the dedicated FastAPI stack
        if: ${{ always() && steps.install-root.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm admin-e2e fastapi --run-id "$ADMIN_E2E_RUN_ID" --down

  nextjs-e2e-nestjs:
    runs-on: ubuntu-latest
    # 2 CPU·8 GB에서 NestJS 이미지·web 빌드와 E2E, 실패 뒤 정리 시간을 둔다.
    timeout-minutes: 60
    env:
      npm_config_verify_deps_before_run: error
      PNPM_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
      WEB_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            templates/nextjs/pnpm-lock.yaml
      - id: install-root
        run: pnpm install --frozen-lockfile
      - run: pnpm --dir templates/nextjs install --frozen-lockfile
      - run: pnpm --dir templates/nextjs exec playwright install --with-deps chromium
      - name: NestJS 대상 web E2E 실행
        timeout-minutes: 45
        run: pnpm web-e2e nestjs --run-id "$WEB_E2E_RUN_ID"
      - name: NestJS 전용 스택 정리
        if: ${{ always() && steps.install-root.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm web-e2e nestjs --run-id "$WEB_E2E_RUN_ID" --down

  nextjs-admin-e2e-nestjs:
    runs-on: ubuntu-latest
    # 2 CPU·8 GB에서 NestJS 이미지·admin 빌드와 E2E, 실패 뒤 정리 시간을 둔다.
    timeout-minutes: 60
    env:
      npm_config_verify_deps_before_run: error
      PNPM_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
      ADMIN_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            templates/nextjs-admin/pnpm-lock.yaml
      - id: install-root
        run: pnpm install --frozen-lockfile
      - run: pnpm --dir templates/nextjs-admin install --frozen-lockfile
      - run: pnpm --dir templates/nextjs-admin exec playwright install --with-deps chromium
      - name: NestJS 대상 admin E2E 실행
        timeout-minutes: 45
        run: pnpm admin-e2e nestjs --run-id "$ADMIN_E2E_RUN_ID"
      - name: NestJS 전용 스택 정리
        if: ${{ always() && steps.install-root.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm admin-e2e nestjs --run-id "$ADMIN_E2E_RUN_ID" --down

  conformance-fastapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance fastapi

  conformance-nestjs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      npm_config_verify_deps_before_run: error
      PNPM_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance nestjs
      - name: NestJS 적합성 소유 스택과 이미지 정리
        if: ${{ always() }}
        run: |
          docker compose -p nestjs -f templates/nestjs/compose.yaml --profile app down -v
          docker image rm nestjs-app:local || true

  # 목 서버는 로컬 프로세스로 뜬다. Docker가 필요 없다.
  conformance-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance mock

  create-combo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 생성 프로젝트의 git 신원 설정
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: pnpm new "$RUNNER_TEMP/aitpl-combo" --api fastapi --web --admin --name ci-combo
      - name: web 단독 조합 생성
        run: pnpm new "$RUNNER_TEMP/aitpl-combo-web" --api fastapi --web --name ci-combo-web-only
      - run: node --test scripts/*.test.mjs .claude/hooks/*.test.mjs
        working-directory: ${{ runner.temp }}/aitpl-combo-web
      - run: pnpm exec turbo run check --dry=json
        working-directory: ${{ runner.temp }}/aitpl-combo-web
      - name: admin 단독 조합 생성
        run: pnpm new "$RUNNER_TEMP/aitpl-combo-admin" --api fastapi --admin --name ci-combo-admin-only
      - run: node --test scripts/*.test.mjs .claude/hooks/*.test.mjs
        working-directory: ${{ runner.temp }}/aitpl-combo-admin
      - run: pnpm exec turbo run check --dry=json
        working-directory: ${{ runner.temp }}/aitpl-combo-admin
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          working-directory: ${{ runner.temp }}/aitpl-combo/apps/api
      - run: pnpm setup
        working-directory: ${{ runner.temp }}/aitpl-combo
      - run: pnpm db:migrate
        working-directory: ${{ runner.temp }}/aitpl-combo
      - run: pnpm --filter web exec playwright install-deps chromium
        working-directory: ${{ runner.temp }}/aitpl-combo
      - run: pnpm --filter admin exec playwright install-deps chromium
        working-directory: ${{ runner.temp }}/aitpl-combo
      - run: pnpm check
        working-directory: ${{ runner.temp }}/aitpl-combo
        env:
          AI_AGENT: "1"
      - run: pnpm test:e2e
        working-directory: ${{ runner.temp }}/aitpl-combo
      - name: 생성 프로젝트의 작업 트리 확인
        working-directory: ${{ runner.temp }}/aitpl-combo
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "생성 프로젝트의 작업 트리가 바뀌었다 — 도구가 쓴 파일을 끄거나 ignore에 더한다." >&2
            printf '%s\n' "$status"
            exit 1
          fi
      - run: docker build apps/api
        working-directory: ${{ runner.temp }}/aitpl-combo
      - run: docker build --tag ci-combo-web:ci -f apps/web/Dockerfile .
        working-directory: ${{ runner.temp }}/aitpl-combo
      - run: docker build --tag ci-combo-admin:ci -f apps/admin/Dockerfile .
        working-directory: ${{ runner.temp }}/aitpl-combo
      - name: 조합 web 컨테이너 시작 확인
        shell: bash
        run: |
          container="aitpl-combo-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$container" >/dev/null 2>&1; then
            echo "컨테이너가 이미 있다 — 다른 실행 이름을 사용하거나 소유한 컨테이너를 먼저 정리한다." >&2
            exit 1
          fi
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          session_secret=$(openssl rand -hex 32)
          docker run --detach --name "$container" \
            --publish 127.0.0.1:3200:3000 \
            --env API_BASE_URL=http://127.0.0.1:8000/api/v1 \
            --env APP_URL=http://127.0.0.1:3200 \
            --env NEXT_PUBLIC_REALTIME_URL=http://127.0.0.1:8000 \
            --env TIME_ZONE=Asia/Seoul \
            --env SESSION_SECRET="$session_secret" \
            ci-combo-web:ci
          timeout 60s bash -c '
            until [ "$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 2 http://127.0.0.1:3200/)" = 200 ]; do
              sleep 1
            done
          '

      - name: 조합 admin 컨테이너 시작 확인
        shell: bash
        run: |
          container="aitpl-combo-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$container" >/dev/null 2>&1; then
            echo "컨테이너가 이미 있다 — 다른 실행 이름을 사용하거나 소유한 컨테이너를 먼저 정리한다." >&2
            exit 1
          fi
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          session_secret=$(openssl rand -hex 32)
          docker run --detach --name "$container" \
            --publish 127.0.0.1:3201:3001 \
            --env API_BASE_URL=http://127.0.0.1:8000/api/v1 \
            --env APP_URL=http://127.0.0.1:3201 \
            --env NEXT_PUBLIC_REALTIME_URL=http://127.0.0.1:8000 \
            --env TIME_ZONE=Asia/Seoul \
            --env SESSION_SECRET="$session_secret" \
            ci-combo-admin:ci
          timeout 60s bash -c '
            until [ "$(curl --location --silent --output /dev/null --write-out "%{http_code}" --max-time 2 http://127.0.0.1:3201/)" = 200 ]; do
              sleep 1
            done
          '

  create-combo-nestjs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      npm_config_verify_deps_before_run: error
      PNPM_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
      NEST_COMPOSE: ci-nest-${{ github.run_id }}-${{ github.run_attempt }}
      API_IMAGE: aitpl-ci-nest-api:${{ github.run_id }}-${{ github.run_attempt }}
      WEB_IMAGE: aitpl-ci-nest-web:${{ github.run_id }}-${{ github.run_attempt }}
      ADMIN_IMAGE: aitpl-ci-nest-admin:${{ github.run_id }}-${{ github.run_attempt }}
      API_CONTAINER: aitpl-ci-nest-api-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_CONTAINER: aitpl-ci-nest-web-${{ github.run_id }}-${{ github.run_attempt }}
      ADMIN_CONTAINER: aitpl-ci-nest-admin-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 생성 프로젝트의 git 신원 설정
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: 전용 경로·스택·이미지·컨테이너의 부재 확인
        id: allocate
        shell: bash
        run: |
          NEST_ROOT="$RUNNER_TEMP/aitpl-ci-nest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$NEST_ROOT"
          docker info >/dev/null
          containers=$(docker ps --all --filter "label=com.docker.compose.project=$NEST_COMPOSE" --format '{{.ID}}')
          volumes=$(docker volume ls --filter "label=com.docker.compose.project=$NEST_COMPOSE" --format '{{.Name}}')
          if [ -n "$containers$volumes" ]; then
            echo "조합 스택이 이미 있다 — 새 실행 이름을 사용한다." >&2
            exit 1
          fi
          for image in "$API_IMAGE" "$WEB_IMAGE" "$ADMIN_IMAGE" "$NEST_COMPOSE-api:latest"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "실행 이미지가 이미 있다 — 소유하지 않은 이미지를 보존한다." >&2
              exit 1
            fi
          done
          for container in "$API_CONTAINER" "$WEB_CONTAINER" "$ADMIN_CONTAINER"; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              echo "실행 컨테이너가 이미 있다 — 소유하지 않은 컨테이너를 보존한다." >&2
              exit 1
            fi
          done
          mkdir -p "$NEST_ROOT/work" "$NEST_ROOT/reports"
          printf '%s\n' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$NEST_ROOT/.task24-owned"
          printf 'NEST_ROOT=%s\n' "$NEST_ROOT" >> "$GITHUB_ENV"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
      - name: 두 프론트 NestJS 조합 생성
        run: |
          pnpm new "$NEST_ROOT/work/both" --api nestjs --web --admin --name "$NEST_COMPOSE"
          test ! -e "$NEST_ROOT/work/both/apps/api/src/generated"
      - name: web만 있는 NestJS 조합 생성
        run: pnpm new "$NEST_ROOT/work/web" --api nestjs --web --name "$NEST_COMPOSE-web"
      - run: node --test scripts/*.test.mjs .claude/hooks/*.test.mjs
        working-directory: ${{ env.NEST_ROOT }}/work/web
      - run: pnpm exec turbo run check --dry=json
        working-directory: ${{ env.NEST_ROOT }}/work/web
      - name: admin만 있는 NestJS 조합 생성
        run: pnpm new "$NEST_ROOT/work/admin" --api nestjs --admin --name "$NEST_COMPOSE-admin"
      - run: node --test scripts/*.test.mjs .claude/hooks/*.test.mjs
        working-directory: ${{ env.NEST_ROOT }}/work/admin
      - run: pnpm exec turbo run check --dry=json
        working-directory: ${{ env.NEST_ROOT }}/work/admin
      - run: pnpm setup
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: pnpm db:migrate
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: pnpm --filter web exec playwright install-deps chromium
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: pnpm --filter admin exec playwright install-deps chromium
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: pnpm check
        working-directory: ${{ env.NEST_ROOT }}/work/both
        env:
          AI_AGENT: "1"
      - run: pnpm test:e2e
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - name: 생성 프로젝트의 작업 트리 확인
        working-directory: ${{ env.NEST_ROOT }}/work/both
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "생성 프로젝트의 작업 트리가 바뀌었다 — 도구의 출력 경로와 ignore를 확인한다." >&2
            printf '%s\n' "$status"
            exit 1
          fi
      - run: docker build --tag "$API_IMAGE" -f apps/api/Dockerfile .
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: docker build --tag "$WEB_IMAGE" -f apps/web/Dockerfile .
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: docker build --tag "$ADMIN_IMAGE" -f apps/admin/Dockerfile .
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - name: API 이미지의 격리·UID·크기와 실제 시작 확인
        working-directory: ${{ env.NEST_ROOT }}/work/both
        run: |
          test "$(docker run --rm --entrypoint id "$API_IMAGE" -u)" = 10001
          docker run --rm --entrypoint node "$API_IMAGE" -e '
            try { require.resolve("next"); process.exit(1); }
            catch (error) { if (error.code !== "MODULE_NOT_FOUND") throw error; }
          '
          docker image inspect --format '{{.Size}}' "$API_IMAGE" | tee "$NEST_ROOT/reports/api-image-size.txt"
          printf 'services:\n  api:\n    image: %s\n' "$API_IMAGE" > "$NEST_ROOT/api-image.yaml"
          docker compose -p "$NEST_COMPOSE" -f apps/api/compose.yaml \
            -f "$NEST_ROOT/api-image.yaml" --profile app run --detach --no-deps \
            --name "$API_CONTAINER" --publish 127.0.0.1:18001:8000 api
          test "$(curl --fail --silent --retry 60 --retry-connrefused --retry-delay 1 \
            --retry-max-time 60 --max-time 2 --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18001/health/live)" = 200
      - name: 조합 web·admin 컨테이너 시작 확인
        shell: bash
        run: |
          session_secret=$(openssl rand -hex 32)
          for app in web admin; do
            if [ "$app" = web ]; then
              image="$WEB_IMAGE"; container="$WEB_CONTAINER"; host=3200; port=3000
            else
              image="$ADMIN_IMAGE"; container="$ADMIN_CONTAINER"; host=3201; port=3001
            fi
            docker run --detach --name "$container" --publish "127.0.0.1:$host:$port" \
              --env API_BASE_URL=http://127.0.0.1:8000/api/v1 \
              --env "APP_URL=http://127.0.0.1:$host" \
              --env NEXT_PUBLIC_REALTIME_URL=http://127.0.0.1:8000 \
              --env TIME_ZONE=Asia/Seoul --env SESSION_SECRET="$session_secret" "$image"
            ready=false
            for attempt in {1..60}; do
              if [ "$(curl --location --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 2 "http://127.0.0.1:$host/")" = 200 ]; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$container"
              exit 1
            fi
          done
      - name: 같은 HEAD의 단독 web으로 R2 숨은 hoist 감사
        run: |
          pnpm new "$NEST_ROOT/work/standalone-web" --template nextjs --name ci-nest-hoist-web --no-git
          pnpm --dir "$NEST_ROOT/work/standalone-web" install --frozen-lockfile
          node --input-type=module - "$GITHUB_WORKSPACE" "$NEST_ROOT" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";
          const [repository, root] = process.argv.slice(2);
          const { hoistShadows } = await import(pathToFileURL(join(repository, "create/test/ci/hoist-audit.mjs")).href);
          const report = hoistShadows(
            readFileSync(join(root, "work/both/node_modules/.modules.yaml"), "utf8"),
            readFileSync(join(root, "work/standalone-web/node_modules/.modules.yaml"), "utf8"),
          );
          writeFileSync(join(root, "reports/hoist-audit.json"), JSON.stringify(report, null, 2) + "\n");
          console.log(JSON.stringify({ ...report, apiOnlyCount: report.apiOnly.length }, null, 2));
          if (report.shadowed.length) throw new Error("단독 web의 숨은 hoist 버전이 조합에서 바뀌었다");
          NODE
      - name: R1 실제 의존성 갱신과 프론트 해석 보고서
        working-directory: ${{ env.NEST_ROOT }}/work/both
        run: |
          cp pnpm-lock.yaml "$NEST_ROOT/before-r1-lock.yaml"
          pnpm --filter api remove nodemailer
          pnpm --filter api add -E nodemailer@10.1.0
          node --input-type=module - "$GITHUB_WORKSPACE" "$NEST_ROOT" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";
          const [repository, root] = process.argv.slice(2);
          const { importerResolutionDiff } = await import(pathToFileURL(join(repository, "create/test/ci/resolution-drift.mjs")).href);
          const changes = importerResolutionDiff(
            readFileSync(join(root, "before-r1-lock.yaml"), "utf8"),
            readFileSync(join(root, "work/both/pnpm-lock.yaml"), "utf8"),
            ["apps/web", "apps/admin"],
          );
          writeFileSync(join(root, "reports/resolution-drift.json"), JSON.stringify(changes, null, 2) + "\n");
          console.log(JSON.stringify(changes, null, 2));
          NODE
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - name: R1 갱신 뒤 전체 앱 검사
        run: pnpm check
        working-directory: ${{ env.NEST_ROOT }}/work/both
        env:
          AI_AGENT: "1"
      - run: pnpm --filter web build
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - run: pnpm --filter admin build
        working-directory: ${{ env.NEST_ROOT }}/work/both
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.allocate.outputs.owned == 'true' }}
        with:
          name: nestjs-create-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NEST_ROOT }}/reports/
          if-no-files-found: warn
      - name: 조합 소유 스택·볼륨·이미지·임시 경로 정리
        if: ${{ always() && steps.allocate.outputs.owned == 'true' }}
        shell: bash
        run: |
          test "$NEST_ROOT" = "$RUNNER_TEMP/aitpl-ci-nest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(cat "$NEST_ROOT/.task24-owned")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          status=0
          for container in "$API_CONTAINER" "$WEB_CONTAINER" "$ADMIN_CONTAINER"; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              docker rm -f "$container" || status=1
            fi
          done
          if [ -f "$NEST_ROOT/work/both/apps/api/compose.yaml" ]; then
            docker compose -p "$NEST_COMPOSE" -f "$NEST_ROOT/work/both/apps/api/compose.yaml" \
              --profile app down --volumes --remove-orphans || status=1
          fi
          for image in "$API_IMAGE" "$WEB_IMAGE" "$ADMIN_IMAGE" "$NEST_COMPOSE-api:latest"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image" || status=1
            fi
          done
          rm -rf "$NEST_ROOT" || status=1
          exit "$status"

  create-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      npm_config_verify_deps_before_run: error
      PNPM_VERIFY_DEPS_BEFORE_RUN: error
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 생성 프로젝트의 git 신원 설정
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: pnpm new "$RUNNER_TEMP/aitpl-fastapi" --template fastapi --name ci-api
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          working-directory: ${{ runner.temp }}/aitpl-fastapi
      - run: uv run poe setup
        working-directory: ${{ runner.temp }}/aitpl-fastapi
      - run: uv run poe check
        working-directory: ${{ runner.temp }}/aitpl-fastapi
      - run: pnpm new "$RUNNER_TEMP/aitpl-nextjs" --template nextjs --name ci-web
      - run: pnpm setup
        working-directory: ${{ runner.temp }}/aitpl-nextjs
      - run: pnpm exec playwright install-deps chromium
        working-directory: ${{ runner.temp }}/aitpl-nextjs
      - run: pnpm check
        working-directory: ${{ runner.temp }}/aitpl-nextjs
      - run: pnpm new "$RUNNER_TEMP/aitpl-admin" --template nextjs-admin --name ci-admin
      - run: pnpm setup
        working-directory: ${{ runner.temp }}/aitpl-admin
      - run: pnpm exec playwright install-deps chromium
        working-directory: ${{ runner.temp }}/aitpl-admin
      - run: pnpm check
        working-directory: ${{ runner.temp }}/aitpl-admin
      - name: 단독 FastAPI 소유 인프라 정리
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/aitpl-fastapi/compose.yaml" ]; then
            docker compose -p ci-api -f "$RUNNER_TEMP/aitpl-fastapi/compose.yaml" down --volumes --remove-orphans
          fi
      - name: 생성 클라이언트가 없는 단독 NestJS 생성
        id: nest-standalone
        shell: bash
        run: |
          root="$RUNNER_TEMP/aitpl-ci-nest-standalone-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          project="ci-nest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-standalone"
          test ! -e "$root"
          containers=$(docker ps --all --filter "label=com.docker.compose.project=$project" --format '{{.ID}}')
          volumes=$(docker volume ls --filter "label=com.docker.compose.project=$project" --format '{{.Name}}')
          test -z "$containers$volumes"
          if docker image inspect "$project-app:latest" >/dev/null 2>&1; then
            echo "단독 실행 이미지가 이미 있다 — 새 실행 이름을 사용한다." >&2
            exit 1
          fi
          mkdir -p "$root"
          printf '%s\n' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$root/.task24-owned"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
          pnpm new "$root/project" --template nestjs --name "$project"
          test ! -e "$root/project/src/generated"
      - run: pnpm setup
        working-directory: ${{ runner.temp }}/aitpl-ci-nest-standalone-${{ github.run_id }}-${{ github.run_attempt }}/project
      - run: pnpm gen
        working-directory: ${{ runner.temp }}/aitpl-ci-nest-standalone-${{ github.run_id }}-${{ github.run_attempt }}/project
      - run: pnpm check
        working-directory: ${{ runner.temp }}/aitpl-ci-nest-standalone-${{ github.run_id }}-${{ github.run_attempt }}/project
      - name: 단독 NestJS 소유 스택·볼륨·이미지·임시 경로 정리
        if: ${{ always() && steps.nest-standalone.outputs.owned == 'true' }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/aitpl-ci-nest-standalone-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          project="ci-nest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-standalone"
          test "$(cat "$root/.task24-owned")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          status=0
          if [ -f "$root/project/compose.yaml" ]; then
            docker compose -p "$project" -f "$root/project/compose.yaml" \
              --profile app down --volumes --remove-orphans || status=1
          fi
          if docker image inspect "$project-app:latest" >/dev/null 2>&1; then
            docker image rm "$project-app:latest" || status=1
          fi
          rm -rf "$root" || status=1
          exit "$status"
