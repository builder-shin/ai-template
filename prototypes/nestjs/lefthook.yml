# Prototype inputs: use installed Node tools; standalone secret tooling remains a planning gate.
pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,js,mjs,json,md,yaml,yml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,js,mjs}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
pre-push:
  jobs:
    - name: check
      run: pnpm check
